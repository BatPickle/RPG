<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Game.css">
    <title>Game</title>
</head>

<body>

    <div id="wholeGameArea">
        <h1>Placeholder!</h1>
        <div class="mainDisplayBox">
            <div id="upperBox">
                <p id="mainTextArea">
                    Please select a character:
                </p>


                <div class="characterCards">
                    <div class="flip-card">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">
                                <img src="pics\swordsman.png" alt="Avatar" style="width:100px;height:200px;">
                            </div>
                            <div class="flip-card-back">
                                <h1>Warrior</h1>
                                <p>health: 100</p>
                                <p>attack: 20</p>
                                <p>stamina: 10</p>
                                <button class="characterSelectBtns" id="warriorBtn"
                                    onclick="warriorStartGame()">Select</button>
                            </div>
                        </div>
                    </div>
                    <div class="flip-card">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">
                                <img src="pics\archer.png" alt="Avatar" style="width:100px;height:200px;">
                            </div>
                            <div class="flip-card-back">
                                <h1>Archer</h1>
                                <p>health: 60</p>
                                <p>attack: 10</p>
                                <p>stamina: 50</p>
                                <button class="characterSelectBtns" id="archerBtn"
                                    onclick="archerStartGame()">Select</button>
                            </div>
                        </div>
                    </div>
                    <div class="flip-card">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">
                                <img src="pics\witch.png" alt="Avatar" style="width:100px;height:200px;">
                            </div>
                            <div class="flip-card-back">
                                <h1>Mage</h1>
                                <p>health: 80</p>
                                <p>attack: 5</p>
                                <p>stamina: 30</p>
                                <button class="characterSelectBtns" id="mageBtn" onclick="mageStartGame()">Select</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>



        <div id="lowerBox">
            <button id="btn1">-</button>
            <button id="btn2">-</button>
            <button id="btn3">-</button>
            <button id="btn4">-</button>
            <button id="btn5">-</button>
            <button id="btn6">-</button>

        </div>
    </div>
    </div>



    <script src="Game.js"></script>
</body>

</html>
